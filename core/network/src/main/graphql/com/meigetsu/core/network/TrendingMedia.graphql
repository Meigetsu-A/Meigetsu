query GetTrendingMedia($type: MediaType) {
  Page(page: 1, perPage: 20) {
    media(type: $type, sort: [TRENDING_DESC]) {
      id
      title {
        romaji
        english
      }
      description
      coverImage {
        extraLarge
      }
      bannerImage
      averageScore
      popularity
      status
      format
      episodes
      chapters
      genres
      season
      seasonYear
    }
  }
}
